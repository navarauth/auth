<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NavAR</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-text-size-adjust: 100%;
    font-family: 'Inter', system-ui, sans-serif;
    background: linear-gradient(180deg, #3a88d4 0%, #7fd3f7 55%, #ffffff 100%);
    display: flex; justify-content: center; align-items: flex-start;
    padding: clamp(40px, 12vh, 110px) 16px 24px;
  }
  .card { width: 100%; max-width: 400px; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  .header {
    padding: 20px 20px 18px;
    color: #fff;
    background: linear-gradient(120deg, #74ccf3, #3a88d4);
  }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header p { margin-top: 4px; font-size: 13px; opacity: .95; }
  .body { padding: 24px 20px 28px; text-align: center; }
  .body p { font-size: 14px; color: #222; margin-bottom: 20px; }
  #openApp {
    width: 100%; height: 46px; border: 0; border-radius: 12px; cursor: pointer;
    color: #fff; font: inherit; font-size: 14px; font-weight: 600;
    background: linear-gradient(120deg, #74ccf3, #3a88d4);
    box-shadow: 0 4px 10px rgba(58,136,212,.3);
  }
  #landing { display: none; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>NavAR</h1>
    <p id="subtitle">Redirecting...</p>
  </div>

  <div class="body" id="landing">
    <p>Open the NavAR app to sign in or manage your account.</p>
    <button id="openApp">Open NavAR</button>
  </div>
</div>

<script>
  const hash = window.location.hash;      // Supabase puts tokens here
  const search = window.location.search;  // or here, depending on the flow

  // Direct visit with no link data: show a simple landing page
  if (!hash && !search) {
    document.getElementById("subtitle").textContent = "Welcome";
    document.getElementById("landing").style.display = "block";
    document.getElementById("openApp").onclick = () => {
      window.location.href = "navar://auth-callback";
    };
  } else {
    // Old or generic link: send it to the right page and keep the token
    const data = hash + "&" + search;
    const isSignup = data.includes("type=signup") || data.includes("type=email");
    const target = isSignup ? "confirm-email" : "reset-password";
    window.location.replace(target + search + hash);
  }
</script>
</body>
</html>
