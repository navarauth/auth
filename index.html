<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: 'Inter', system-ui, sans-serif;
    background: linear-gradient(180deg, #3a88d4 0%, #7fd3f7 55%, #ffffff 100%);
    display: flex; justify-content: center; align-items: flex-start;
    padding: 130px 24px 24px;
  }
  .card { width: 100%; max-width: 420px; background: #fff; border-radius: 26px; overflow: hidden; }
  .header {
    padding: 28px 26px 26px;
    color: #fff;
    background: linear-gradient(120deg, #74ccf3, #3a88d4);
  }
  .header h1 { font-size: 34px; font-weight: 800; }
  .header p { margin-top: 6px; font-size: 15px; }
  form { padding: 24px 24px 40px; }
  label { display: block; font-size: 14px; color: #222; margin-bottom: 8px; }
  .field { position: relative; margin-bottom: 20px; }
  .field input {
    width: 100%; height: 46px; padding: 0 46px 0 14px;
    border: 1px solid #d5d5d5; border-radius: 12px;
    font: inherit; font-size: 15px; outline: none;
  }
  .field input:focus { border-color: #3a88d4; }
  .eye {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; cursor: pointer; color: #aaa; font-size: 18px; line-height: 1;
  }
  #error { color: #d33; font-size: 13px; min-height: 18px; margin-bottom: 10px; }
  #submit {
    width: 100%; height: 52px; border: 0; border-radius: 14px; cursor: pointer;
    color: #fff; font: inherit; font-size: 16px; font-weight: 700;
    background: linear-gradient(120deg, #74ccf3, #3a88d4);
    box-shadow: 0 6px 14px rgba(58,136,212,.35);
  }
  #submit:disabled { opacity: .6; cursor: default; }

  /* Alert modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; justify-content: center; align-items: center; padding: 24px;
  }
  .overlay.show { display: flex; }
  .modal {
    width: 100%; max-width: 300px; background: #fff; border-radius: 14px;
    padding: 34px 24px 24px; text-align: center;
  }
  .modal h2 { font-size: 16px; font-weight: 700; color: #333; }
  .modal p { margin: 28px 0 32px; font-size: 14px; color: #222; }
  .modal button {
    width: 100%; height: 38px; border: 0; border-radius: 10px; cursor: pointer;
    background: #3fa0e0; color: #fff; font: inherit; font-size: 14px; font-weight: 700;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Reset Password</h1>
    <p>Change your password</p>
  </div>
  <form id="form">
    <label for="pw">New Password</label>
    <div class="field">
      <input id="pw" type="password" placeholder="Enter here" autocomplete="new-password">
      <button type="button" class="eye" data-target="pw" aria-label="Show password">👁</button>
    </div>

    <label for="pw2">Confirm Password</label>
    <div class="field">
      <input id="pw2" type="password" placeholder="Enter here" autocomplete="new-password">
      <button type="button" class="eye" data-target="pw2" aria-label="Show password">👁</button>
    </div>

    <div id="error"></div>
    <button id="submit" type="submit">Change Password</button>
  </form>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Success</h2>
    <p id="modalMsg">Password changed successfully!</p>
    <button id="okBtn">OK</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>

  const SUPABASE_URL = "https://kblobarjzrloqjikpbun.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtibG9iYXJqenJsb3FqaWtwYnVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTQ0MjksImV4cCI6MjEwNDk3MDQyOX0.-O4t_Nt789rtB19bXbzUn0x4qepBVxlfh2ibDjwp03Y";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = (id) => document.getElementById(id);
  const errorEl = $("error"), submitBtn = $("submit");
  let recoveryReady = false;

  sb.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") recoveryReady = true;
  });

  document.querySelectorAll(".eye").forEach((btn) => {
    btn.addEventListener("click", () => {
      const input = $(btn.dataset.target);
      input.type = input.type === "password" ? "text" : "password";
    });
  });

  function showModal(title, msg, onOk) {
    $("modalTitle").textContent = title;
    $("modalMsg").textContent = msg;
    $("overlay").classList.add("show");
    $("okBtn").onclick = () => {
      $("overlay").classList.remove("show");
      if (onOk) onOk();
    };
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    const pw = $("pw").value, pw2 = $("pw2").value;

    if (pw.length < 6) { errorEl.textContent = "Password must be at least 6 characters."; return; }
    if (pw !== pw2)    { errorEl.textContent = "Passwords do not match."; return; }

    // Make sure the reset link was valid
    const { data } = await sb.auth.getSession();
    if (!recoveryReady && !data.session) {
      errorEl.textContent = "This reset link is invalid or expired. Please request a new one.";
      return;
    }

    submitBtn.disabled = true;
    const { error } = await sb.auth.updateUser({ password: pw });
    submitBtn.disabled = false;

    if (error) { errorEl.textContent = error.message; return; }

    await sb.auth.signOut(); // don't leave a session open in the browser
    $("form").reset();
    showModal("Success", "Password changed successfully!", () => {

    });
  });
</script>
</body>
</html>
