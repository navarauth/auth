<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NavAR Account</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#f4f4f7; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:16px; }
  .card { background:#fff; border-radius:12px; padding:24px; max-width:360px; width:100%; box-shadow:0 4px 16px rgba(0,0,0,0.08); text-align:center; }
  h1 { font-size:18px; margin:0 0 8px; }
  p { font-size:14px; color:#555; margin:0 0 20px; }
  input { width:100%; padding:10px; margin-bottom:12px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; font-size:14px; }
  button { width:100%; padding:10px; border:none; border-radius:8px; background:#4f46e5; color:#fff; font-size:14px; cursor:pointer; }
  button:disabled { opacity:0.6; cursor:default; }
  a.button-link { display:block; width:100%; padding:10px; border-radius:8px; background:#4f46e5; color:#fff; text-decoration:none; box-sizing:border-box; margin-top:8px; }
  .error { color:#d33; font-size:13px; margin-top:8px; }
  .success { color:#1a7f37; font-size:13px; margin-top:8px; }
</style>
</head>
<body>
<div class="card" id="card">
  <p>Loading...</p>
</div>

<script>
// TODO: fill in your real Supabase project URL and anon key (same values as in
// AuthService.cs's Inspector fields, this page needs its own copy since it's separate
// from the Unity app).
const SUPABASE_URL = "https://kblobarjzrloqjikpbun.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtibG9iYXJqenJsb3FqaWtwYnVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTQ0MjksImV4cCI6MjEwNDk3MDQyOX0.-O4t_Nt789rtB19bXbzUn0x4qepBVxlfh2ibDjwp03Y";

// Must exactly match the scheme you registered in AndroidManifest.xml.
const APP_SCHEME = "navar://auth-callback";

function getFragmentParams() {
  const hash = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash;
  const params = {};
  hash.split('&').forEach(pair => {
    const [k, v] = pair.split('=');
    if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
  });
  return params;
}

const card = document.getElementById('card');
const params = getFragmentParams();

if (params.error_description) {
  card.innerHTML = `<h1>Something went wrong</h1><p class="error">${params.error_description}</p>`;
} else if (params.type === 'recovery' && params.access_token) {
  renderResetForm(params.access_token);
} else if (params.access_token) {
  renderOAuthSuccess(params.access_token, params.refresh_token || '');
} else {
  card.innerHTML = `<h1>NavAR Account</h1><p>This page is used for password resets and social sign-in. Open it from a link in the app or your email.</p>`;
}

function renderResetForm(accessToken) {
  card.innerHTML = `
    <h1>Set a new password</h1>
    <p>Choose a new password for your NavAR account.</p>
    <input id="new-password" type="password" placeholder="New password (min 8 characters)" />
    <button id="submit-btn">Update password</button>
    <div id="msg"></div>
  `;

  document.getElementById('submit-btn').onclick = async () => {
    const newPassword = document.getElementById('new-password').value;
    const msg = document.getElementById('msg');

    if (!newPassword || newPassword.length < 8) {
      msg.className = 'error';
      msg.textContent = 'Password must be at least 8 characters.';
      return;
    }

    document.getElementById('submit-btn').disabled = true;

    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${accessToken}`
        },
        body: JSON.stringify({ password: newPassword })
      });

      if (res.ok) {
        msg.className = 'success';
        msg.textContent = "Password updated! You can close this page and sign in with your new password.";
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('new-password').style.display = 'none';
      } else {
        const data = await res.json().catch(() => ({}));
        msg.className = 'error';
        msg.textContent = data.msg || data.error_description || 'Could not update password, try again.';
        document.getElementById('submit-btn').disabled = false;
      }
    } catch (e) {
      msg.className = 'error';
      msg.textContent = 'Network error, try again.';
      document.getElementById('submit-btn').disabled = false;
    }
  };
}

function renderOAuthSuccess(accessToken, refreshToken) {
  const deepLink = `${APP_SCHEME}#access_token=${encodeURIComponent(accessToken)}&refresh_token=${encodeURIComponent(refreshToken)}`;

  card.innerHTML = `
    <h1>Signed in!</h1>
    <p>Taking you back to NavAR...</p>
    <a class="button-link" href="${deepLink}">Open NavAR</a>
  `;

  // try to jump back into the app automatically. The button above is the fallback
  // in case the browser blocks an automatic redirect to a custom scheme.
  window.location.href = deepLink;
}
</script>
</body>
</html>
