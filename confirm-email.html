<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm Email</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-text-size-adjust: 100%;
    font-family: 'Inter', system-ui, sans-serif;
    background: linear-gradient(180deg, #3a88d4 0%, #7fd3f7 55%, #ffffff 100%);
    display: flex; justify-content: center; align-items: flex-start;
    padding: clamp(40px, 12vh, 110px) 16px 24px;
  }
  .card { width: 100%; max-width: 400px; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  .header {
    padding: 20px 20px 18px;
    color: #fff;
    background: linear-gradient(120deg, #74ccf3, #3a88d4);
  }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header p { margin-top: 4px; font-size: 13px; opacity: .95; }
  .body { padding: 28px 20px 28px; text-align: center; }
  .icon {
    width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .icon.ok { background: #e3f6e9; color: #2e9e57; }
  .icon.fail { background: #fde8e8; color: #d33; }
  .icon.wait { background: #e6f2fc; color: #3a88d4; }
  .body h2 { font-size: 18px; font-weight: 700; color: #222; margin-bottom: 8px; }
  .body p { font-size: 14px; color: #444; line-height: 1.5; }
  #openApp {
    display: none; width: 100%; height: 46px; margin-top: 22px;
    border: 0; border-radius: 12px; cursor: pointer;
    color: #fff; font: inherit; font-size: 14px; font-weight: 600;
    background: linear-gradient(120deg, #74ccf3, #3a88d4);
    box-shadow: 0 4px 10px rgba(58,136,212,.3);
  }
  #hint { margin-top: 14px; font-size: 12px; color: #666; min-height: 16px; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Confirm Email</h1>
    <p>Verify your NavAR account</p>
  </div>

  <div class="body">
    <div class="icon wait" id="icon"></div>
    <h2 id="title">Checking your link...</h2>
    <p id="msg"></p>
    <button id="openApp">Open NavAR</button>
    <div id="hint"></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  const CHECK = `<svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
  const CROSS = `<svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;

  const APP_DEEP_LINK = "navar://auth-callback";

  // Supabase puts the result in the URL after the # (or after the ? in some cases)
  const hashParams = new URLSearchParams(window.location.hash.substring(1));
  const queryParams = new URLSearchParams(window.location.search);
  const get = (key) => hashParams.get(key) || queryParams.get(key);

  const errorCode = get("error_code") || get("error");
  const errorDesc = get("error_description");

  const icon = $("icon"), title = $("title"), msg = $("msg"), btn = $("openApp");

  if (errorCode) {
    icon.className = "icon fail";
    icon.innerHTML = CROSS;
    title.textContent = "Link expired or invalid";
    msg.textContent = (errorCode === "otp_expired")
      ? "This confirmation link has expired. Open the NavAR app and sign up again to get a new email."
      : (errorDesc ? errorDesc.replace(/\+/g, " ") : "Something went wrong. Open the NavAR app and try signing up again.");
  } else {
    icon.className = "icon ok";
    icon.innerHTML = CHECK;
    title.textContent = "Email confirmed!";
    msg.textContent = "Your account is ready. Open the NavAR app and sign in.";
    btn.style.display = "block";
    btn.onclick = () => {
      window.location.href = APP_DEEP_LINK;
      setTimeout(() => {
        $("hint").textContent = "If the app did not open, go back to NavAR and sign in.";
      }, 1500);
    };
  }
</script>
</body>
</html>
